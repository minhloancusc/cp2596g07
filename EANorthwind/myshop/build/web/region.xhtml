<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">
    <h:head>
        <title>Region</title>
    </h:head>
    <h:body>
        <!-- Show all Region -->
        <h:dataTable var="itemRegion" value="#{regionMB.showAllRegion()}">
            <h:column>
                <f:facet name="header">Region ID</f:facet>
                <h:outputText value="#{itemRegion.regionID}"/>
            </h:column>
            <h:column>
                <f:facet name="header">Region Description</f:facet>
                <h:outputText value="#{itemRegion.regionDescription}"/>
            </h:column>
        </h:dataTable>
    </h:body>
</html>
