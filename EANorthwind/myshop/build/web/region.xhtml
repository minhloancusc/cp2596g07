<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">
    <h:head>
        <title>Region</title>
    </h:head>
    <h:body>
        <h:form id="fregion">
            <h:panelGrid columns="2">
                <h:outputLabel for="regionID" value="Region ID"/>
                <h:inputText id="regionID" value="#{regionMB.region.regionID}"/>
                
                <h:outputLabel for="regionDescription" value="Region Description"/>
                <h:inputText id="regionDescription" value="#{regionMB.region.regionDescription}"/>
                
                <h:outputText value=""/>
                <h:panelGroup>
                    <h:commandButton value="Add" action="#{regionMB.saveRegion()}" type="submit"/>
                    <h:commandButton value="Reset" type="reset"/>
                </h:panelGroup>
            </h:panelGrid>
        </h:form>
        <!-- Show all Region -->
        <h:dataTable var="itemRegion" value="#{regionMB.showAllRegion()}">
            <h:column>
                <f:facet name="header">Region ID</f:facet>
                <h:outputText value="#{itemRegion.regionID}"/>
            </h:column>
            <h:column>
                <f:facet name="header">Region Description</f:facet>
                <h:outputText value="#{itemRegion.regionDescription}"/>
            </h:column>
            <h:column>
                <f:facet name="header">Edit</f:facet>
                <h:form>
                    <h:commandButton value="Edit" action="#{regionMB.editRegion(itemRegion.regionID)}"/>
                </h:form>
            </h:column>
            <h:column>
                <f:facet name="header">Delete</f:facet>
                <h:form>
                    <h:commandButton value="Delete" action="#{regionMB.deleteRegion(itemRegion.regionID)}"/>
                </h:form>
            </h:column>
        </h:dataTable>
    </h:body>
</html>
